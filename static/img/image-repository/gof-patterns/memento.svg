<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" role="img" aria-label="메멘토 패턴">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
    <style>
      .title { font: 800 30px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #111827; }
      .subtitle { font: 600 16px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #4b5563; }
      .box { fill: #eef2ff; stroke: #1f2937; stroke-width: 2.5; }
      .actor { fill: #f8fafc; stroke: #111827; stroke-width: 2.5; }
      .abstract { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2.5; }
      .concrete { fill: #ecfdf5; stroke: #047857; stroke-width: 2.5; }
      .product { fill: #fef3c7; stroke: #b45309; stroke-width: 2.5; }
      .warning { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2.5; }
      .boxText { font: 800 16px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #111827; }
      .mutedText { font: 700 15px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #374151; }
      .arrow { stroke: #111827; stroke-width: 2.6; fill: none; }
      .dashed { stroke: #6b7280; stroke-width: 2.4; stroke-dasharray: 9 7; fill: none; }
      .arrowLabel { font: 700 14px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #374151; }
      .noteBox { fill: #111827; stroke: #111827; stroke-width: 2; }
      .noteText { font: 700 14px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #f9fafb; }
    </style>
  </defs>
  <rect width="1180" height="520" fill="#fffaf0"/>
  <text x="54" y="58" class="title">메멘토 패턴</text>
  <text x="54" y="88" class="subtitle">Originator의 상태 스냅샷을 Memento로 만들고 Caretaker가 보관한다</text>
  <line x1="300" y1="190" x2="460" y2="134" class="arrow" marker-end="url(#arrow)"/>
<text x="380" y="152" text-anchor="middle" class="arrowLabel">save()</text>
<line x1="570" y1="173" x2="570" y2="270" class="arrow" marker-end="url(#arrow)"/>
<text x="618" y="232" text-anchor="middle" class="arrowLabel">보관</text>
<line x1="680" y1="309" x2="830" y2="229" class="arrow" marker-end="url(#arrow)"/>
<text x="755" y="259" text-anchor="middle" class="arrowLabel">restore()</text>
<line x1="830" y1="190" x2="300" y2="190" class="dashed" marker-end="url(#arrow)"/>
<text x="565" y="160" text-anchor="middle" class="arrowLabel">내부 상태 직접 노출 없음</text>
  <rect x="80" y="170" width="220" height="78" rx="8" class="abstract"/>
<text x="190" y="203" text-anchor="middle" class="boxText">Originator</text>
<text x="190" y="223" text-anchor="middle" class="boxText">현재 상태</text>
<rect x="460" y="95" width="220" height="78" rx="8" class="product"/>
<text x="570" y="128" text-anchor="middle" class="boxText">Memento</text>
<text x="570" y="148" text-anchor="middle" class="boxText">상태 스냅샷</text>
<rect x="460" y="270" width="220" height="78" rx="8" class="concrete"/>
<text x="570" y="303" text-anchor="middle" class="boxText">Caretaker</text>
<text x="570" y="323" text-anchor="middle" class="boxText">history stack</text>
<rect x="830" y="170" width="230" height="78" rx="8" class="product"/>
<text x="945" y="203" text-anchor="middle" class="boxText">복원된 Originator</text>
<text x="945" y="223" text-anchor="middle" class="boxText">undo/rollback</text>
  <rect x="80" y="405" width="450" height="54" rx="6" class="noteBox"/>
<text x="98" y="429" text-anchor="start" class="noteText">포인트: 상태 저장은 하되 캡슐화는 유지한다.</text>
<text x="98" y="449" text-anchor="start" class="noteText">대표 예시는 실행 취소.</text>
</svg>
