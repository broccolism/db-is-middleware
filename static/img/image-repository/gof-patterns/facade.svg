<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" role="img" aria-label="퍼사드 패턴">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
    <style>
      .title { font: 800 30px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #111827; }
      .subtitle { font: 600 16px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #4b5563; }
      .box { fill: #eef2ff; stroke: #1f2937; stroke-width: 2.5; }
      .actor { fill: #f8fafc; stroke: #111827; stroke-width: 2.5; }
      .abstract { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2.5; }
      .concrete { fill: #ecfdf5; stroke: #047857; stroke-width: 2.5; }
      .product { fill: #fef3c7; stroke: #b45309; stroke-width: 2.5; }
      .warning { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2.5; }
      .boxText { font: 800 16px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #111827; }
      .mutedText { font: 700 15px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #374151; }
      .arrow { stroke: #111827; stroke-width: 2.6; fill: none; }
      .dashed { stroke: #6b7280; stroke-width: 2.4; stroke-dasharray: 9 7; fill: none; }
      .arrowLabel { font: 700 14px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #374151; }
      .noteBox { fill: #111827; stroke: #111827; stroke-width: 2; }
      .noteText { font: 700 14px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #f9fafb; }
    </style>
  </defs>
  <rect width="1180" height="520" fill="#fffaf0"/>
  <text x="54" y="58" class="title">퍼사드 패턴</text>
  <text x="54" y="88" class="subtitle">Client는 복잡한 내부 객체들을 직접 다루지 않고 Facade만 호출한다</text>
  <line x1="230" y1="229" x2="360" y2="209" class="arrow" marker-end="url(#arrow)"/>
<text x="295" y="209" text-anchor="middle" class="arrowLabel">단순 호출</text>
<line x1="580" y1="190" x2="740" y2="119" class="arrow" marker-end="url(#arrow)"/>
<text x="660" y="144" text-anchor="middle" class="arrowLabel">내부 조율</text>
<line x1="580" y1="215" x2="740" y2="239" class="arrow" marker-end="url(#arrow)"/>
<line x1="580" y1="240" x2="740" y2="359" class="arrow" marker-end="url(#arrow)"/>
  <rect x="70" y="190" width="160" height="78" rx="8" class="actor"/>
<text x="150" y="223" text-anchor="middle" class="boxText">Client</text>
<rect x="360" y="170" width="220" height="78" rx="8" class="abstract"/>
<text x="470" y="203" text-anchor="middle" class="boxText">Facade</text>
<text x="470" y="223" text-anchor="middle" class="boxText">placeOrder()</text>
<rect x="740" y="80" width="190" height="78" rx="8" class="product"/>
<text x="835" y="113" text-anchor="middle" class="boxText">Inventory</text>
<text x="835" y="133" text-anchor="middle" class="boxText">System</text>
<rect x="740" y="200" width="190" height="78" rx="8" class="product"/>
<text x="835" y="233" text-anchor="middle" class="boxText">Payment</text>
<text x="835" y="253" text-anchor="middle" class="boxText">System</text>
<rect x="740" y="320" width="190" height="78" rx="8" class="product"/>
<text x="835" y="353" text-anchor="middle" class="boxText">Shipping</text>
<text x="835" y="373" text-anchor="middle" class="boxText">System</text>
  <rect x="70" y="405" width="430" height="54" rx="6" class="noteBox"/>
<text x="88" y="429" text-anchor="start" class="noteText">포인트: 내부 구조를 숨겨 사용법을 단순화한다.</text>
<text x="88" y="449" text-anchor="start" class="noteText">서브시스템 자체를 없애는 것은 아니다.</text>
</svg>
