<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" role="img" aria-label="상태 패턴">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
    <style>
      .title { font: 800 30px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #111827; }
      .subtitle { font: 600 16px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #4b5563; }
      .box { fill: #eef2ff; stroke: #1f2937; stroke-width: 2.5; }
      .actor { fill: #f8fafc; stroke: #111827; stroke-width: 2.5; }
      .abstract { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2.5; }
      .concrete { fill: #ecfdf5; stroke: #047857; stroke-width: 2.5; }
      .product { fill: #fef3c7; stroke: #b45309; stroke-width: 2.5; }
      .warning { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2.5; }
      .boxText { font: 800 16px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #111827; }
      .mutedText { font: 700 15px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #374151; }
      .arrow { stroke: #111827; stroke-width: 2.6; fill: none; }
      .dashed { stroke: #6b7280; stroke-width: 2.4; stroke-dasharray: 9 7; fill: none; }
      .arrowLabel { font: 700 14px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #374151; }
      .noteBox { fill: #111827; stroke: #111827; stroke-width: 2; }
      .noteText { font: 700 14px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #f9fafb; }
    </style>
  </defs>
  <rect width="1180" height="520" fill="#fffaf0"/>
  <text x="54" y="58" class="title">상태 패턴</text>
  <text x="54" y="88" class="subtitle">Context는 현재 State에게 처리를 위임하고 State 교체로 동작이 바뀐다</text>
  <line x1="290" y1="214" x2="430" y2="174" class="arrow" marker-end="url(#arrow)"/>
<text x="360" y="184" text-anchor="middle" class="arrowLabel">위임</text>
<line x1="640" y1="154" x2="760" y2="119" class="dashed" marker-end="url(#arrow)"/>
<text x="700" y="126" text-anchor="middle" class="arrowLabel">구현</text>
<line x1="640" y1="194" x2="760" y2="259" class="dashed" marker-end="url(#arrow)"/>
<text x="700" y="244" text-anchor="middle" class="arrowLabel">구현</text>
<line x1="865" y1="158" x2="865" y2="220" class="arrow" marker-end="url(#arrow)"/>
<text x="940" y="198" text-anchor="middle" class="arrowLabel">상태 전환</text>
  <rect x="80" y="175" width="210" height="78" rx="8" class="abstract"/>
<text x="185" y="208" text-anchor="middle" class="boxText">Context</text>
<text x="185" y="228" text-anchor="middle" class="boxText">Order</text>
<text x="185" y="248" text-anchor="middle" class="boxText">currentState</text>
<rect x="430" y="135" width="210" height="78" rx="8" class="abstract"/>
<text x="535" y="168" text-anchor="middle" class="boxText">State</text>
<text x="535" y="188" text-anchor="middle" class="boxText">handle()</text>
<rect x="760" y="80" width="210" height="78" rx="8" class="concrete"/>
<text x="865" y="113" text-anchor="middle" class="boxText">PaidState</text>
<text x="865" y="133" text-anchor="middle" class="boxText">handle()</text>
<rect x="760" y="220" width="210" height="78" rx="8" class="product"/>
<text x="865" y="253" text-anchor="middle" class="boxText">ShippedState</text>
<text x="865" y="273" text-anchor="middle" class="boxText">handle()</text>
  <rect x="80" y="405" width="450" height="54" rx="6" class="noteBox"/>
<text x="98" y="429" text-anchor="start" class="noteText">포인트: if 상태 분기를 상태 객체들로 밀어낸다.</text>
<text x="98" y="449" text-anchor="start" class="noteText">상태가 바뀌면 행동도 바뀐다.</text>
</svg>
