<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" role="img" aria-label="플라이웨이트 패턴">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
        <marker id="umlGeneralization" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
          <path d="M 1 1 L 11 6 L 1 11 z" fill="#fffaf0" stroke="#111827" stroke-width="1.5"/>
        </marker>
    <style>
      .title { font: 800 30px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #111827; }
      .subtitle { font: 600 16px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #4b5563; }
      .box { fill: #eef2ff; stroke: #1f2937; stroke-width: 2.5; }
      .actor { fill: #f8fafc; stroke: #111827; stroke-width: 2.5; }
      .abstract { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2.5; }
      .concrete { fill: #ecfdf5; stroke: #047857; stroke-width: 2.5; }
      .product { fill: #fef3c7; stroke: #b45309; stroke-width: 2.5; }
      .warning { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2.5; }
      .boxText { font: 800 16px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #111827; }
      .mutedText { font: 700 15px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #374151; }
      .arrow { stroke: #111827; stroke-width: 2.6; fill: none; }
      .dashed { stroke: #6b7280; stroke-width: 2.4; stroke-dasharray: 9 7; fill: none; }
      .inheritance { stroke: #111827; stroke-width: 2.4; fill: none; }
      .realization { stroke: #6b7280; stroke-width: 2.4; stroke-dasharray: 9 7; fill: none; }
      .arrowLabel { font: 700 14px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #374151; }
      .noteBox { fill: #111827; stroke: #111827; stroke-width: 2; }
      .noteText { font: 700 14px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #f9fafb; }
    </style>
  </defs>
  <rect width="1180" height="520" fill="#fffaf0"/>
  <text x="54" y="58" class="title">플라이웨이트 패턴</text>
  <text x="54" y="88" class="subtitle">내부 상태는 공유 객체에, 외부 상태는 호출 시 전달한다</text>
  <line x1="230" y1="224" x2="315" y2="194" class="arrow" marker-end="url(#arrow)"/>
<text x="272" y="199" text-anchor="middle" class="arrowLabel">type 요청</text>
<line x1="545" y1="194" x2="650" y2="154" class="arrow" marker-end="url(#arrow)"/>
<text x="597" y="164" text-anchor="middle" class="arrowLabel">공유 객체 반환</text>
<line x1="770" y1="193" x2="770" y2="285" class="dashed" marker-end="url(#arrow)"/>
<text x="865" y="250" text-anchor="middle" class="arrowLabel">외부 상태와 결합</text>
<line x1="890" y1="154" x2="965" y2="224" class="arrow" marker-end="url(#arrow)"/>
  <rect x="70" y="185" width="160" height="78" rx="8" class="actor"/>
<text x="150" y="218" text-anchor="middle" class="boxText">Client</text>
<rect x="315" y="155" width="230" height="78" rx="8" class="abstract"/>
<text x="430" y="188" text-anchor="middle" class="boxText">FlyweightFactory</text>
<text x="430" y="208" text-anchor="middle" class="boxText">cache</text>
<rect x="650" y="115" width="240" height="78" rx="8" class="product"/>
<text x="770" y="148" text-anchor="middle" class="boxText">Flyweight</text>
<text x="770" y="168" text-anchor="middle" class="boxText">TreeType</text>
<text x="770" y="188" text-anchor="middle" class="boxText">texture/color</text>
<rect x="650" y="285" width="240" height="78" rx="8" class="concrete"/>
<text x="770" y="318" text-anchor="middle" class="boxText">extrinsic state</text>
<text x="770" y="338" text-anchor="middle" class="boxText">x, y, size</text>
<rect x="965" y="185" width="150" height="78" rx="8" class="actor"/>
<text x="1040" y="218" text-anchor="middle" class="boxText">draw(x,y)</text>
  <rect x="70" y="405" width="470" height="54" rx="6" class="noteBox"/>
<text x="88" y="429" text-anchor="start" class="noteText">포인트: Flyweight는 “가벼운 객체”.</text>
<text x="88" y="449" text-anchor="start" class="noteText">공유 가능한 무거운 부분을 빼서 재사용한다.</text>
</svg>
