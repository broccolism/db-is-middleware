<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" role="img" aria-label="책임 연쇄 패턴">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
        <marker id="umlGeneralization" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
          <path d="M 1 1 L 11 6 L 1 11 z" fill="#fffaf0" stroke="#111827" stroke-width="1.5"/>
        </marker>
    <style>
      .title { font: 800 30px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #111827; }
      .subtitle { font: 600 16px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #4b5563; }
      .box { fill: #eef2ff; stroke: #1f2937; stroke-width: 2.5; }
      .actor { fill: #f8fafc; stroke: #111827; stroke-width: 2.5; }
      .abstract { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2.5; }
      .concrete { fill: #ecfdf5; stroke: #047857; stroke-width: 2.5; }
      .product { fill: #fef3c7; stroke: #b45309; stroke-width: 2.5; }
      .warning { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2.5; }
      .boxText { font: 800 16px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #111827; }
      .mutedText { font: 700 15px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #374151; }
      .arrow { stroke: #111827; stroke-width: 2.6; fill: none; }
      .dashed { stroke: #6b7280; stroke-width: 2.4; stroke-dasharray: 9 7; fill: none; }
      .inheritance { stroke: #111827; stroke-width: 2.4; fill: none; }
      .realization { stroke: #6b7280; stroke-width: 2.4; stroke-dasharray: 9 7; fill: none; }
      .arrowLabel { font: 700 14px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #374151; }
      .noteBox { fill: #111827; stroke: #111827; stroke-width: 2; }
      .noteText { font: 700 14px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #f9fafb; }
    </style>
  </defs>
  <rect width="1180" height="520" fill="#fffaf0"/>
  <text x="54" y="58" class="title">책임 연쇄 패턴</text>
  <text x="54" y="88" class="subtitle">각 Handler는 처리하거나 다음 Handler로 넘긴다</text>
  <line x1="220" y1="229" x2="300" y2="199" class="arrow" marker-end="url(#arrow)"/>
<text x="260" y="204" text-anchor="middle" class="arrowLabel">요청</text>
<line x1="490" y1="199" x2="575" y2="199" class="arrow" marker-end="url(#arrow)"/>
<text x="532" y="189" text-anchor="middle" class="arrowLabel">못하면 next</text>
<line x1="765" y1="199" x2="850" y2="199" class="arrow" marker-end="url(#arrow)"/>
<text x="807" y="189" text-anchor="middle" class="arrowLabel">못하면 next</text>
  <rect x="60" y="190" width="160" height="78" rx="8" class="actor"/>
<text x="140" y="223" text-anchor="middle" class="boxText">Request</text>
<rect x="300" y="160" width="190" height="78" rx="8" class="abstract"/>
<text x="395" y="193" text-anchor="middle" class="boxText">Handler A</text>
<text x="395" y="213" text-anchor="middle" class="boxText">기본 상담</text>
<rect x="575" y="160" width="190" height="78" rx="8" class="concrete"/>
<text x="670" y="193" text-anchor="middle" class="boxText">Handler B</text>
<text x="670" y="213" text-anchor="middle" class="boxText">기술 지원</text>
<rect x="850" y="160" width="190" height="78" rx="8" class="product"/>
<text x="945" y="193" text-anchor="middle" class="boxText">Handler C</text>
<text x="945" y="213" text-anchor="middle" class="boxText">관리자</text>
  <rect x="60" y="390" width="460" height="54" rx="6" class="noteBox"/>
<text x="78" y="414" text-anchor="start" class="noteText">포인트: 요청자와 최종 처리자를 느슨하게 연결한다.</text>
<text x="78" y="434" text-anchor="start" class="noteText">누가 처리할지는 체인을 타며 결정된다.</text>
</svg>
