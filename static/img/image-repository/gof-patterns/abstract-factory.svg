<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" role="img" aria-label="추상 팩토리 패턴">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
        <marker id="umlGeneralization" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
          <path d="M 1 1 L 11 6 L 1 11 z" fill="#fffaf0" stroke="#111827" stroke-width="1.5"/>
        </marker>
    <style>
      .title { font: 800 30px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #111827; }
      .subtitle { font: 600 16px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #4b5563; }
      .box { fill: #eef2ff; stroke: #1f2937; stroke-width: 2.5; }
      .actor { fill: #f8fafc; stroke: #111827; stroke-width: 2.5; }
      .abstract { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2.5; }
      .concrete { fill: #ecfdf5; stroke: #047857; stroke-width: 2.5; }
      .product { fill: #fef3c7; stroke: #b45309; stroke-width: 2.5; }
      .warning { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2.5; }
      .boxText { font: 800 16px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #111827; }
      .mutedText { font: 700 15px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #374151; }
      .arrow { stroke: #111827; stroke-width: 2.6; fill: none; }
      .dashed { stroke: #6b7280; stroke-width: 2.4; stroke-dasharray: 9 7; fill: none; }
      .inheritance { stroke: #111827; stroke-width: 2.4; fill: none; }
      .realization { stroke: #6b7280; stroke-width: 2.4; stroke-dasharray: 9 7; fill: none; }
      .arrowLabel { font: 700 14px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #374151; }
      .noteBox { fill: #111827; stroke: #111827; stroke-width: 2; }
      .noteText { font: 700 14px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #f9fafb; }
    </style>
  </defs>
  <rect width="1180" height="520" fill="#fffaf0"/>
  <text x="54" y="58" class="title">추상 팩토리 패턴</text>
  <text x="54" y="88" class="subtitle">같은 생성 호출, 다른 구체 팩토리, 제품군 전체 교체</text>
  <line x1="214" y1="219" x2="280" y2="190" class="arrow" marker-end="url(#arrow)"/>
<text x="247" y="160" text-anchor="middle" class="arrowLabel">factory 호출</text>
<line x1="565" y1="154" x2="490" y2="170" class="realization" marker-end="url(#umlGeneralization)"/>
<text x="527" y="152" text-anchor="middle" class="arrowLabel">구현</text>
<line x1="565" y1="274" x2="490" y2="210" class="realization" marker-end="url(#umlGeneralization)"/>
<text x="527" y="256" text-anchor="middle" class="arrowLabel">구현</text>
<line x1="755" y1="154" x2="855" y2="154" class="arrow" marker-end="url(#arrow)"/>
<text x="805" y="144" text-anchor="middle" class="arrowLabel">생성</text>
<line x1="755" y1="274" x2="855" y2="274" class="arrow" marker-end="url(#arrow)"/>
<text x="805" y="264" text-anchor="middle" class="arrowLabel">생성</text>
  <rect x="54" y="180" width="160" height="78" rx="8" class="actor"/>
<text x="134" y="213" text-anchor="middle" class="boxText">Client</text>
<rect x="280" y="150" width="210" height="78" rx="8" class="abstract"/>
<text x="385" y="183" text-anchor="middle" class="boxText">AbstractFactory</text>
<text x="385" y="203" text-anchor="middle" class="boxText">createButton()</text>
<text x="385" y="223" text-anchor="middle" class="boxText">createCheckbox()</text>
<rect x="565" y="115" width="190" height="78" rx="8" class="concrete"/>
<text x="660" y="148" text-anchor="middle" class="boxText">WindowsFactory</text>
<rect x="565" y="235" width="190" height="78" rx="8" class="concrete"/>
<text x="660" y="268" text-anchor="middle" class="boxText">MacFactory</text>
<rect x="855" y="115" width="230" height="78" rx="8" class="product"/>
<text x="970" y="148" text-anchor="middle" class="boxText">WindowsButton</text>
<text x="970" y="168" text-anchor="middle" class="boxText">WindowsCheckbox</text>
<rect x="855" y="235" width="230" height="78" rx="8" class="product"/>
<text x="970" y="268" text-anchor="middle" class="boxText">MacButton</text>
<text x="970" y="288" text-anchor="middle" class="boxText">MacCheckbox</text>
  <rect x="54" y="405" width="470" height="54" rx="6" class="noteBox"/>
<text x="72" y="429" text-anchor="start" class="noteText">포인트: Application(new WindowsFactory())처럼</text>
<text x="72" y="449" text-anchor="start" class="noteText">팩토리만 바꾸면 관련 객체 묶음이 함께 바뀐다.</text>
</svg>
