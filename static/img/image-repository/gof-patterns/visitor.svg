<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" role="img" aria-label="비지터 패턴">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
        <marker id="umlGeneralization" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
          <path d="M 1 1 L 11 6 L 1 11 z" fill="#fffaf0" stroke="#111827" stroke-width="1.5"/>
        </marker>
    <style>
      .title { font: 800 30px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #111827; }
      .subtitle { font: 600 16px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #4b5563; }
      .box { fill: #eef2ff; stroke: #1f2937; stroke-width: 2.5; }
      .actor { fill: #f8fafc; stroke: #111827; stroke-width: 2.5; }
      .abstract { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2.5; }
      .concrete { fill: #ecfdf5; stroke: #047857; stroke-width: 2.5; }
      .product { fill: #fef3c7; stroke: #b45309; stroke-width: 2.5; }
      .warning { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2.5; }
      .boxText { font: 800 16px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #111827; }
      .mutedText { font: 700 15px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #374151; }
      .arrow { stroke: #111827; stroke-width: 2.6; fill: none; }
      .dashed { stroke: #6b7280; stroke-width: 2.4; stroke-dasharray: 9 7; fill: none; }
      .inheritance { stroke: #111827; stroke-width: 2.4; fill: none; }
      .realization { stroke: #6b7280; stroke-width: 2.4; stroke-dasharray: 9 7; fill: none; }
      .arrowLabel { font: 700 14px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #374151; }
      .noteBox { fill: #111827; stroke: #111827; stroke-width: 2; }
      .noteText { font: 700 14px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #f9fafb; }
    </style>
  </defs>
  <rect width="1180" height="520" fill="#fffaf0"/>
  <text x="54" y="58" class="title">비지터 패턴</text>
  <text x="54" y="88" class="subtitle">여러 원소 타입에 대한 하나의 작업 묶음을 Visitor에 모은다</text>
  <line x1="170" y1="285" x2="170" y2="218" class="realization" marker-end="url(#umlGeneralization)"/>
<text x="235" y="262" text-anchor="middle" class="arrowLabel">implements</text>
<line x1="280" y1="179" x2="435" y2="174" class="arrow" marker-end="url(#arrow)"/>
<text x="357" y="166" text-anchor="middle" class="arrowLabel">accept</text>
<line x1="820" y1="129" x2="695" y2="160" class="realization" marker-end="url(#umlGeneralization)"/>
<line x1="820" y1="284" x2="695" y2="199" class="realization" marker-end="url(#umlGeneralization)"/>
<line x1="435" y1="220" x2="280" y2="324" class="arrow" marker-end="url(#arrow)"/>
<text x="357" y="290" text-anchor="middle" class="arrowLabel">visitX(this)</text>
  <rect x="60" y="140" width="220" height="78" rx="8" class="abstract"/>
<text x="170" y="173" text-anchor="middle" class="boxText">Element</text>
<text x="170" y="193" text-anchor="middle" class="boxText">accept(visitor)</text>
<rect x="60" y="285" width="220" height="78" rx="8" class="product"/>
<text x="170" y="318" text-anchor="middle" class="boxText">Text / Image / Table</text>
<text x="170" y="338" text-anchor="middle" class="boxText">ConcreteElement</text>
<rect x="435" y="135" width="260" height="78" rx="8" class="abstract"/>
<text x="565" y="168" text-anchor="middle" class="boxText">Visitor</text>
<text x="565" y="188" text-anchor="middle" class="boxText">visitText()</text>
<text x="565" y="208" text-anchor="middle" class="boxText">visitImage()</text>
<text x="565" y="228" text-anchor="middle" class="boxText">visitTable()</text>
<rect x="820" y="90" width="230" height="78" rx="8" class="concrete"/>
<text x="935" y="123" text-anchor="middle" class="boxText">HtmlExportVisitor</text>
<text x="935" y="143" text-anchor="middle" class="boxText">타입별 HTML 처리</text>
<rect x="820" y="245" width="230" height="78" rx="8" class="product"/>
<text x="935" y="278" text-anchor="middle" class="boxText">PdfExportVisitor</text>
<text x="935" y="298" text-anchor="middle" class="boxText">타입별 PDF 처리</text>
  <rect x="60" y="405" width="520" height="54" rx="6" class="noteBox"/>
<text x="78" y="429" text-anchor="start" class="noteText">포인트: 객체 구조가 안정적이고,</text>
<text x="78" y="449" text-anchor="start" class="noteText">새 작업을 자주 추가할 때 유리하다.</text>
</svg>
