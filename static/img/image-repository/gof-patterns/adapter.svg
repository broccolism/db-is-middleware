<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" role="img" aria-label="어댑터 패턴">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
        <marker id="umlGeneralization" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
          <path d="M 1 1 L 11 6 L 1 11 z" fill="#fffaf0" stroke="#111827" stroke-width="1.5"/>
        </marker>
    <style>
      .title { font: 800 30px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #111827; }
      .subtitle { font: 600 16px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #4b5563; }
      .box { fill: #eef2ff; stroke: #1f2937; stroke-width: 2.5; }
      .actor { fill: #f8fafc; stroke: #111827; stroke-width: 2.5; }
      .abstract { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2.5; }
      .concrete { fill: #ecfdf5; stroke: #047857; stroke-width: 2.5; }
      .product { fill: #fef3c7; stroke: #b45309; stroke-width: 2.5; }
      .warning { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2.5; }
      .boxText { font: 800 16px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #111827; }
      .mutedText { font: 700 15px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #374151; }
      .arrow { stroke: #111827; stroke-width: 2.6; fill: none; }
      .dashed { stroke: #6b7280; stroke-width: 2.4; stroke-dasharray: 9 7; fill: none; }
      .inheritance { stroke: #111827; stroke-width: 2.4; fill: none; }
      .realization { stroke: #6b7280; stroke-width: 2.4; stroke-dasharray: 9 7; fill: none; }
      .arrowLabel { font: 700 14px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #374151; }
      .noteBox { fill: #111827; stroke: #111827; stroke-width: 2; }
      .noteText { font: 700 14px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #f9fafb; }
    </style>
  </defs>
  <rect width="1180" height="520" fill="#fffaf0"/>
  <text x="54" y="58" class="title">어댑터 패턴</text>
  <text x="54" y="88" class="subtitle">Client는 Target만 보고, Adapter가 Adaptee 호출 형태로 변환한다</text>
  <line x1="230" y1="229" x2="310" y2="179" class="arrow" marker-end="url(#arrow)"/>
<text x="270" y="194" text-anchor="middle" class="arrowLabel">기대 인터페이스</text>
<line x1="610" y1="179" x2="520" y2="179" class="realization" marker-end="url(#umlGeneralization)"/>
<text x="565" y="169" text-anchor="middle" class="arrowLabel">implements</text>
<line x1="820" y1="179" x2="910" y2="179" class="arrow" marker-end="url(#arrow)"/>
<text x="865" y="169" text-anchor="middle" class="arrowLabel">변환 호출</text>
  <rect x="70" y="190" width="160" height="78" rx="8" class="actor"/>
<text x="150" y="223" text-anchor="middle" class="boxText">Client</text>
<rect x="310" y="140" width="210" height="78" rx="8" class="abstract"/>
<text x="415" y="173" text-anchor="middle" class="boxText">Target</text>
<text x="415" y="193" text-anchor="middle" class="boxText">request()</text>
<rect x="610" y="140" width="210" height="78" rx="8" class="concrete"/>
<text x="715" y="173" text-anchor="middle" class="boxText">Adapter</text>
<text x="715" y="193" text-anchor="middle" class="boxText">request()</text>
<rect x="910" y="140" width="210" height="78" rx="8" class="product"/>
<text x="1015" y="173" text-anchor="middle" class="boxText">Adaptee</text>
<text x="1015" y="193" text-anchor="middle" class="boxText">specificRequest()</text>
  <rect x="70" y="390" width="450" height="54" rx="6" class="noteBox"/>
<text x="88" y="414" text-anchor="start" class="noteText">포인트: 결과물은 보통 Target을 구현하고</text>
<text x="88" y="434" text-anchor="start" class="noteText">Adaptee를 감싸는 구체 Adapter 클래스.</text>
</svg>
