<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" role="img" aria-label="컴포지트 패턴">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
        <marker id="umlGeneralization" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
          <path d="M 1 1 L 11 6 L 1 11 z" fill="#fffaf0" stroke="#111827" stroke-width="1.5"/>
        </marker>
    <style>
      .title { font: 800 30px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #111827; }
      .subtitle { font: 600 16px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #4b5563; }
      .box { fill: #eef2ff; stroke: #1f2937; stroke-width: 2.5; }
      .actor { fill: #f8fafc; stroke: #111827; stroke-width: 2.5; }
      .abstract { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2.5; }
      .concrete { fill: #ecfdf5; stroke: #047857; stroke-width: 2.5; }
      .product { fill: #fef3c7; stroke: #b45309; stroke-width: 2.5; }
      .warning { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2.5; }
      .boxText { font: 800 16px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #111827; }
      .mutedText { font: 700 15px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #374151; }
      .arrow { stroke: #111827; stroke-width: 2.6; fill: none; }
      .dashed { stroke: #6b7280; stroke-width: 2.4; stroke-dasharray: 9 7; fill: none; }
      .inheritance { stroke: #111827; stroke-width: 2.4; fill: none; }
      .realization { stroke: #6b7280; stroke-width: 2.4; stroke-dasharray: 9 7; fill: none; }
      .arrowLabel { font: 700 14px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #374151; }
      .noteBox { fill: #111827; stroke: #111827; stroke-width: 2; }
      .noteText { font: 700 14px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #f9fafb; }
    </style>
  </defs>
  <rect width="1180" height="520" fill="#fffaf0"/>
  <text x="54" y="58" class="title">컴포지트 패턴</text>
  <text x="54" y="88" class="subtitle">Composite는 Component 타입 자식 목록을 가진다</text>
  <line x1="275" y1="270" x2="500" y2="188" class="realization" marker-end="url(#umlGeneralization)"/>
<text x="387" y="219" text-anchor="middle" class="arrowLabel">implements</text>
<line x1="845" y1="270" x2="650" y2="188" class="realization" marker-end="url(#umlGeneralization)"/>
<text x="747" y="219" text-anchor="middle" class="arrowLabel">implements</text>
<line x1="845" y1="348" x2="895" y2="405" class="arrow" marker-end="url(#arrow)"/>
<text x="870" y="366" text-anchor="middle" class="arrowLabel">has many</text>
  <rect x="460" y="110" width="230" height="78" rx="8" class="abstract"/>
<text x="575" y="143" text-anchor="middle" class="boxText">Component</text>
<text x="575" y="163" text-anchor="middle" class="boxText">operation()</text>
<rect x="180" y="270" width="190" height="78" rx="8" class="product"/>
<text x="275" y="303" text-anchor="middle" class="boxText">Leaf</text>
<text x="275" y="323" text-anchor="middle" class="boxText">File</text>
<rect x="720" y="270" width="250" height="78" rx="8" class="concrete"/>
<text x="845" y="303" text-anchor="middle" class="boxText">Composite</text>
<text x="845" y="323" text-anchor="middle" class="boxText">Folder</text>
<text x="845" y="343" text-anchor="middle" class="boxText">List&lt;Component&gt;</text>
<rect x="835" y="405" width="170" height="78" rx="8" class="product"/>
<text x="920" y="438" text-anchor="middle" class="boxText">자식들</text>
<text x="920" y="458" text-anchor="middle" class="boxText">Component[]</text>
  <rect x="70" y="405" width="490" height="54" rx="6" class="noteBox"/>
<text x="88" y="429" text-anchor="start" class="noteText">포인트: “가진다”는 상속이 아니라</text>
<text x="88" y="449" text-anchor="start" class="noteText">공통 타입 자식들을 참조/포함한다는 뜻.</text>
</svg>
