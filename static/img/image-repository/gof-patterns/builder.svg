<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" role="img" aria-label="빌더 패턴">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
        <marker id="umlGeneralization" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
          <path d="M 1 1 L 11 6 L 1 11 z" fill="#fffaf0" stroke="#111827" stroke-width="1.5"/>
        </marker>
    <style>
      .title { font: 800 30px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #111827; }
      .subtitle { font: 600 16px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #4b5563; }
      .box { fill: #eef2ff; stroke: #1f2937; stroke-width: 2.5; }
      .actor { fill: #f8fafc; stroke: #111827; stroke-width: 2.5; }
      .abstract { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2.5; }
      .concrete { fill: #ecfdf5; stroke: #047857; stroke-width: 2.5; }
      .product { fill: #fef3c7; stroke: #b45309; stroke-width: 2.5; }
      .warning { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2.5; }
      .boxText { font: 800 16px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #111827; }
      .mutedText { font: 700 15px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #374151; }
      .arrow { stroke: #111827; stroke-width: 2.6; fill: none; }
      .dashed { stroke: #6b7280; stroke-width: 2.4; stroke-dasharray: 9 7; fill: none; }
      .inheritance { stroke: #111827; stroke-width: 2.4; fill: none; }
      .realization { stroke: #6b7280; stroke-width: 2.4; stroke-dasharray: 9 7; fill: none; }
      .arrowLabel { font: 700 14px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #374151; }
      .noteBox { fill: #111827; stroke: #111827; stroke-width: 2; }
      .noteText { font: 700 14px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #f9fafb; }
    </style>
  </defs>
  <rect width="1180" height="520" fill="#fffaf0"/>
  <text x="54" y="58" class="title">빌더 패턴</text>
  <text x="54" y="88" class="subtitle">Director는 순서, ConcreteBuilder는 실제 조립 결과를 책임진다</text>
  <line x1="199" y1="224" x2="250" y2="194" class="arrow" marker-end="url(#arrow)"/>
<text x="224" y="199" text-anchor="middle" class="arrowLabel">빌더 전달</text>
<line x1="440" y1="194" x2="500" y2="184" class="arrow" marker-end="url(#arrow)"/>
<text x="470" y="179" text-anchor="middle" class="arrowLabel">단계 호출</text>
<line x1="775" y1="144" x2="710" y2="174" class="realization" marker-end="url(#umlGeneralization)"/>
<line x1="775" y1="264" x2="710" y2="204" class="realization" marker-end="url(#umlGeneralization)"/>
<line x1="965" y1="144" x2="995" y2="144" class="arrow" marker-end="url(#arrow)"/>
<text x="980" y="134" text-anchor="middle" class="arrowLabel">결과</text>
<line x1="965" y1="264" x2="995" y2="264" class="arrow" marker-end="url(#arrow)"/>
<text x="980" y="254" text-anchor="middle" class="arrowLabel">결과</text>
  <rect x="54" y="185" width="145" height="78" rx="8" class="actor"/>
<text x="126" y="218" text-anchor="middle" class="boxText">Client</text>
<rect x="250" y="155" width="190" height="78" rx="8" class="abstract"/>
<text x="345" y="188" text-anchor="middle" class="boxText">Director</text>
<text x="345" y="208" text-anchor="middle" class="boxText">construct()</text>
<rect x="500" y="145" width="210" height="78" rx="8" class="abstract"/>
<text x="605" y="178" text-anchor="middle" class="boxText">Builder</text>
<text x="605" y="198" text-anchor="middle" class="boxText">buildPartA()</text>
<text x="605" y="218" text-anchor="middle" class="boxText">buildPartB()</text>
<rect x="775" y="105" width="190" height="78" rx="8" class="concrete"/>
<text x="870" y="138" text-anchor="middle" class="boxText">HtmlBuilder</text>
<rect x="775" y="225" width="190" height="78" rx="8" class="concrete"/>
<text x="870" y="258" text-anchor="middle" class="boxText">PdfBuilder</text>
<rect x="995" y="105" width="135" height="78" rx="8" class="product"/>
<text x="1062" y="138" text-anchor="middle" class="boxText">HTML</text>
<text x="1062" y="158" text-anchor="middle" class="boxText">문서</text>
<rect x="995" y="225" width="135" height="78" rx="8" class="product"/>
<text x="1062" y="258" text-anchor="middle" class="boxText">PDF</text>
<text x="1062" y="278" text-anchor="middle" class="boxText">문서</text>
  <rect x="54" y="405" width="480" height="54" rx="6" class="noteBox"/>
<text x="72" y="429" text-anchor="start" class="noteText">포인트: GoF식 빌더는 빌더 객체를 넘겨</text>
<text x="72" y="449" text-anchor="start" class="noteText">같은 조립 순서를 다른 표현 결과로 바꾼다.</text>
</svg>
