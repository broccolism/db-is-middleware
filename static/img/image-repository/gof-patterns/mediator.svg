<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" role="img" aria-label="중재자 패턴">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
        <marker id="umlGeneralization" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
          <path d="M 1 1 L 11 6 L 1 11 z" fill="#fffaf0" stroke="#111827" stroke-width="1.5"/>
        </marker>
    <style>
      .title { font: 800 30px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #111827; }
      .subtitle { font: 600 16px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #4b5563; }
      .box { fill: #eef2ff; stroke: #1f2937; stroke-width: 2.5; }
      .actor { fill: #f8fafc; stroke: #111827; stroke-width: 2.5; }
      .abstract { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2.5; }
      .concrete { fill: #ecfdf5; stroke: #047857; stroke-width: 2.5; }
      .product { fill: #fef3c7; stroke: #b45309; stroke-width: 2.5; }
      .warning { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2.5; }
      .boxText { font: 800 16px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #111827; }
      .mutedText { font: 700 15px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #374151; }
      .arrow { stroke: #111827; stroke-width: 2.6; fill: none; }
      .dashed { stroke: #6b7280; stroke-width: 2.4; stroke-dasharray: 9 7; fill: none; }
      .inheritance { stroke: #111827; stroke-width: 2.4; fill: none; }
      .realization { stroke: #6b7280; stroke-width: 2.4; stroke-dasharray: 9 7; fill: none; }
      .arrowLabel { font: 700 14px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #374151; }
      .noteBox { fill: #111827; stroke: #111827; stroke-width: 2; }
      .noteText { font: 700 14px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #f9fafb; }
    </style>
  </defs>
  <rect width="1180" height="520" fill="#fffaf0"/>
  <text x="54" y="58" class="title">중재자 패턴</text>
  <text x="54" y="88" class="subtitle">복잡한 N:N 의존을 Mediator 중심의 1:N 관계로 줄인다</text>
  <line x1="280" y1="134" x2="470" y2="180" class="arrow" marker-end="url(#arrow)"/>
<text x="375" y="147" text-anchor="middle" class="arrowLabel">알림</text>
<line x1="280" y1="324" x2="470" y2="220" class="arrow" marker-end="url(#arrow)"/>
<text x="375" y="262" text-anchor="middle" class="arrowLabel">알림</text>
<line x1="700" y1="180" x2="890" y2="134" class="arrow" marker-end="url(#arrow)"/>
<text x="795" y="147" text-anchor="middle" class="arrowLabel">조정</text>
<line x1="700" y1="220" x2="890" y2="324" class="arrow" marker-end="url(#arrow)"/>
<text x="795" y="262" text-anchor="middle" class="arrowLabel">조정</text>
  <rect x="470" y="150" width="230" height="78" rx="8" class="abstract"/>
<text x="585" y="183" text-anchor="middle" class="boxText">Mediator</text>
<text x="585" y="203" text-anchor="middle" class="boxText">notify(sender,event)</text>
<rect x="90" y="95" width="190" height="78" rx="8" class="product"/>
<text x="185" y="128" text-anchor="middle" class="boxText">Colleague A</text>
<text x="185" y="148" text-anchor="middle" class="boxText">Button</text>
<rect x="90" y="285" width="190" height="78" rx="8" class="product"/>
<text x="185" y="318" text-anchor="middle" class="boxText">Colleague B</text>
<text x="185" y="338" text-anchor="middle" class="boxText">Dialog</text>
<rect x="890" y="95" width="190" height="78" rx="8" class="product"/>
<text x="985" y="128" text-anchor="middle" class="boxText">Colleague C</text>
<text x="985" y="148" text-anchor="middle" class="boxText">Input</text>
<rect x="890" y="285" width="190" height="78" rx="8" class="product"/>
<text x="985" y="318" text-anchor="middle" class="boxText">Colleague D</text>
<text x="985" y="338" text-anchor="middle" class="boxText">List</text>
  <rect x="70" y="405" width="470" height="54" rx="6" class="noteBox"/>
<text x="88" y="429" text-anchor="start" class="noteText">포인트: 동료 객체끼리 직접 얽히는 대신</text>
<text x="88" y="449" text-anchor="start" class="noteText">중재자 한 곳에서 흐름을 조율한다.</text>
</svg>
