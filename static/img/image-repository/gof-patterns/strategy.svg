<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" role="img" aria-label="전략 패턴">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
    <style>
      .title { font: 800 30px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #111827; }
      .subtitle { font: 600 16px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #4b5563; }
      .box { fill: #eef2ff; stroke: #1f2937; stroke-width: 2.5; }
      .actor { fill: #f8fafc; stroke: #111827; stroke-width: 2.5; }
      .abstract { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2.5; }
      .concrete { fill: #ecfdf5; stroke: #047857; stroke-width: 2.5; }
      .product { fill: #fef3c7; stroke: #b45309; stroke-width: 2.5; }
      .warning { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2.5; }
      .boxText { font: 800 16px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #111827; }
      .mutedText { font: 700 15px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #374151; }
      .arrow { stroke: #111827; stroke-width: 2.6; fill: none; }
      .dashed { stroke: #6b7280; stroke-width: 2.4; stroke-dasharray: 9 7; fill: none; }
      .arrowLabel { font: 700 14px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #374151; }
      .noteBox { fill: #111827; stroke: #111827; stroke-width: 2; }
      .noteText { font: 700 14px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #f9fafb; }
    </style>
  </defs>
  <rect width="1180" height="520" fill="#fffaf0"/>
  <text x="54" y="58" class="title">전략 패턴</text>
  <text x="54" y="88" class="subtitle">Context는 Strategy 인터페이스만 알고 실제 알고리즘은 주입받는다</text>
  <line x1="290" y1="219" x2="430" y2="179" class="arrow" marker-end="url(#arrow)"/>
<text x="360" y="189" text-anchor="middle" class="arrowLabel">has Strategy</text>
<line x1="650" y1="159" x2="780" y2="119" class="dashed" marker-end="url(#arrow)"/>
<line x1="650" y1="199" x2="780" y2="259" class="dashed" marker-end="url(#arrow)"/>
  <rect x="80" y="180" width="210" height="78" rx="8" class="actor"/>
<text x="185" y="213" text-anchor="middle" class="boxText">Context</text>
<text x="185" y="233" text-anchor="middle" class="boxText">Calculator</text>
<rect x="430" y="140" width="220" height="78" rx="8" class="abstract"/>
<text x="540" y="173" text-anchor="middle" class="boxText">Strategy</text>
<text x="540" y="193" text-anchor="middle" class="boxText">calculate()</text>
<rect x="780" y="80" width="230" height="78" rx="8" class="concrete"/>
<text x="895" y="113" text-anchor="middle" class="boxText">NormalDiscount</text>
<text x="895" y="133" text-anchor="middle" class="boxText">calculate()</text>
<rect x="780" y="220" width="230" height="78" rx="8" class="product"/>
<text x="895" y="253" text-anchor="middle" class="boxText">CouponDiscount</text>
<text x="895" y="273" text-anchor="middle" class="boxText">calculate()</text>
  <rect x="80" y="405" width="470" height="54" rx="6" class="noteBox"/>
<text x="98" y="429" text-anchor="start" class="noteText">포인트: 전략은 “알고리즘 하나”를 갈아끼운다.</text>
<text x="98" y="449" text-anchor="start" class="noteText">비지터는 여러 타입별 처리 묶음을 갈아끼운다.</text>
</svg>
