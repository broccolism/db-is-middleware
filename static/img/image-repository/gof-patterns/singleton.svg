<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" role="img" aria-label="싱글턴 패턴">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
        <marker id="umlGeneralization" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
          <path d="M 1 1 L 11 6 L 1 11 z" fill="#fffaf0" stroke="#111827" stroke-width="1.5"/>
        </marker>
    <style>
      .title { font: 800 30px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #111827; }
      .subtitle { font: 600 16px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #4b5563; }
      .box { fill: #eef2ff; stroke: #1f2937; stroke-width: 2.5; }
      .actor { fill: #f8fafc; stroke: #111827; stroke-width: 2.5; }
      .abstract { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2.5; }
      .concrete { fill: #ecfdf5; stroke: #047857; stroke-width: 2.5; }
      .product { fill: #fef3c7; stroke: #b45309; stroke-width: 2.5; }
      .warning { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2.5; }
      .boxText { font: 800 16px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #111827; }
      .mutedText { font: 700 15px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #374151; }
      .arrow { stroke: #111827; stroke-width: 2.6; fill: none; }
      .dashed { stroke: #6b7280; stroke-width: 2.4; stroke-dasharray: 9 7; fill: none; }
      .inheritance { stroke: #111827; stroke-width: 2.4; fill: none; }
      .realization { stroke: #6b7280; stroke-width: 2.4; stroke-dasharray: 9 7; fill: none; }
      .arrowLabel { font: 700 14px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #374151; }
      .noteBox { fill: #111827; stroke: #111827; stroke-width: 2; }
      .noteText { font: 700 14px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #f9fafb; }
    </style>
  </defs>
  <rect width="1180" height="520" fill="#fffaf0"/>
  <text x="54" y="58" class="title">싱글턴 패턴</text>
  <text x="54" y="88" class="subtitle">전역 접근점은 제공하지만, 공유 상태와 테스트 어려움에 주의</text>
  <line x1="245" y1="179" x2="405" y2="210" class="arrow" marker-end="url(#arrow)"/>
<text x="325" y="184" text-anchor="middle" class="arrowLabel">getInstance()</text>
<line x1="245" y1="324" x2="405" y2="250" class="arrow" marker-end="url(#arrow)"/>
<text x="325" y="277" text-anchor="middle" class="arrowLabel">getInstance()</text>
<line x1="675" y1="229" x2="840" y2="229" class="arrow" marker-end="url(#arrow)"/>
<text x="757" y="219" text-anchor="middle" class="arrowLabel">반환</text>
  <rect x="80" y="140" width="165" height="78" rx="8" class="actor"/>
<text x="162" y="173" text-anchor="middle" class="boxText">Client A</text>
<rect x="80" y="285" width="165" height="78" rx="8" class="actor"/>
<text x="162" y="318" text-anchor="middle" class="boxText">Client B</text>
<rect x="405" y="180" width="270" height="78" rx="8" class="abstract"/>
<text x="540" y="213" text-anchor="middle" class="boxText">Singleton</text>
<text x="540" y="233" text-anchor="middle" class="boxText">-private instance</text>
<text x="540" y="253" text-anchor="middle" class="boxText">+getInstance()</text>
<rect x="840" y="190" width="210" height="78" rx="8" class="product"/>
<text x="945" y="223" text-anchor="middle" class="boxText">same instance</text>
<text x="945" y="243" text-anchor="middle" class="boxText">단 하나의 객체</text>
  <rect x="80" y="405" width="430" height="54" rx="6" class="noteBox"/>
<text x="98" y="429" text-anchor="start" class="noteText">포인트: 생성 제어가 핵심.</text>
<text x="98" y="449" text-anchor="start" class="noteText">무분별한 전역 변수처럼 쓰면 독이 된다.</text>
</svg>
