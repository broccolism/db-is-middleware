<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" role="img" aria-label="팩토리 메소드 패턴">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
    <style>
      .title { font: 800 30px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #111827; }
      .subtitle { font: 600 16px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #4b5563; }
      .box { fill: #eef2ff; stroke: #1f2937; stroke-width: 2.5; }
      .actor { fill: #f8fafc; stroke: #111827; stroke-width: 2.5; }
      .abstract { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2.5; }
      .concrete { fill: #ecfdf5; stroke: #047857; stroke-width: 2.5; }
      .product { fill: #fef3c7; stroke: #b45309; stroke-width: 2.5; }
      .warning { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2.5; }
      .boxText { font: 800 16px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #111827; }
      .mutedText { font: 700 15px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #374151; }
      .arrow { stroke: #111827; stroke-width: 2.6; fill: none; }
      .dashed { stroke: #6b7280; stroke-width: 2.4; stroke-dasharray: 9 7; fill: none; }
      .arrowLabel { font: 700 14px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #374151; }
      .noteBox { fill: #111827; stroke: #111827; stroke-width: 2; }
      .noteText { font: 700 14px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #f9fafb; }
    </style>
  </defs>
  <rect width="1180" height="520" fill="#fffaf0"/>
  <text x="54" y="58" class="title">팩토리 메소드 패턴</text>
  <text x="54" y="88" class="subtitle">Creator는 factoryMethod()만 부르고, ConcreteCreator가 제품을 고른다</text>
  <line x1="266" y1="195" x2="360" y2="154" class="dashed" marker-end="url(#arrow)"/>
<text x="313" y="164" text-anchor="middle" class="arrowLabel">상속/오버라이드</text>
<line x1="266" y1="235" x2="360" y2="294" class="dashed" marker-end="url(#arrow)"/>
<text x="313" y="276" text-anchor="middle" class="arrowLabel">상속/오버라이드</text>
<line x1="580" y1="154" x2="700" y2="154" class="arrow" marker-end="url(#arrow)"/>
<text x="640" y="144" text-anchor="middle" class="arrowLabel">생성</text>
<line x1="580" y1="294" x2="700" y2="294" class="arrow" marker-end="url(#arrow)"/>
<text x="640" y="284" text-anchor="middle" class="arrowLabel">생성</text>
<line x1="870" y1="154" x2="950" y2="214" class="arrow" marker-end="url(#arrow)"/>
<text x="910" y="174" text-anchor="middle" class="arrowLabel">반환</text>
<line x1="870" y1="294" x2="950" y2="244" class="arrow" marker-end="url(#arrow)"/>
<text x="910" y="259" text-anchor="middle" class="arrowLabel">반환</text>
  <rect x="76" y="175" width="190" height="78" rx="8" class="abstract"/>
<text x="171" y="208" text-anchor="middle" class="boxText">Creator</text>
<text x="171" y="228" text-anchor="middle" class="boxText">operation()</text>
<text x="171" y="248" text-anchor="middle" class="boxText">factoryMethod()</text>
<rect x="360" y="115" width="220" height="78" rx="8" class="concrete"/>
<text x="470" y="148" text-anchor="middle" class="boxText">ConcreteCreatorA</text>
<text x="470" y="168" text-anchor="middle" class="boxText">factoryMethod()</text>
<rect x="360" y="255" width="220" height="78" rx="8" class="concrete"/>
<text x="470" y="288" text-anchor="middle" class="boxText">ConcreteCreatorB</text>
<text x="470" y="308" text-anchor="middle" class="boxText">factoryMethod()</text>
<rect x="700" y="115" width="170" height="78" rx="8" class="product"/>
<text x="785" y="148" text-anchor="middle" class="boxText">ProductA</text>
<rect x="700" y="255" width="170" height="78" rx="8" class="product"/>
<text x="785" y="288" text-anchor="middle" class="boxText">ProductB</text>
<rect x="950" y="185" width="170" height="78" rx="8" class="actor"/>
<text x="1035" y="218" text-anchor="middle" class="boxText">Client는</text>
<text x="1035" y="238" text-anchor="middle" class="boxText">Product 타입만 봄</text>
  <rect x="76" y="405" width="460" height="54" rx="6" class="noteBox"/>
<text x="94" y="429" text-anchor="start" class="noteText">포인트: 추상 팩토리는 제품군,</text>
<text x="94" y="449" text-anchor="start" class="noteText">팩토리 메소드는 보통 제품 하나 생성에 초점.</text>
</svg>
