<rect x="760" y="250" width="240" height="78" rx="8" class="product"/>
<text x="880" y="283" text-anchor="middle" class="boxText">ConcreteDecorator</text>
<text x="880" y="303" text-anchor="middle" class="boxText">Milk / Whip</text>
  <rect x="70" y="405" width="430" height="54" rx="6" class="noteBox"/>
<text x="88" y="429" text-anchor="start" class="noteText">포인트: 형식은 같은 타입으로 맞추고,</text>
