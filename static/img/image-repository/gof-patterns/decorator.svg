  <line x1="390" y1="129" x2="290" y2="199" class="realization" marker-end="url(#umlGeneralization)"/>
<text x="340" y="154" text-anchor="middle" class="arrowLabel">implements</text>
<line x1="390" y1="289" x2="290" y2="225" class="realization" marker-end="url(#umlGeneralization)"/>
