<line x1="760" y1="289" x2="620" y2="289" class="inheritance" marker-end="url(#umlGeneralization)"/>
<text x="690" y="279" text-anchor="middle" class="arrowLabel">상속</text>
  <rect x="70" y="170" width="220" height="78" rx="8" class="abstract"/>
<text x="180" y="203" text-anchor="middle" class="boxText">Component</text>
<text x="180" y="223" text-anchor="middle" class="boxText">operation()</text>
<rect x="390" y="90" width="230" height="78" rx="8" class="product"/>
<text x="505" y="123" text-anchor="middle" class="boxText">ConcreteComponent</text>
<text x="505" y="143" text-anchor="middle" class="boxText">BasicCoffee</text>
<rect x="390" y="250" width="230" height="78" rx="8" class="concrete"/>
