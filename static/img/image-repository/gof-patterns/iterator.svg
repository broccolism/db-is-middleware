<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" role="img" aria-label="반복자 패턴">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
    <style>
      .title { font: 800 30px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #111827; }
      .subtitle { font: 600 16px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #4b5563; }
      .box { fill: #eef2ff; stroke: #1f2937; stroke-width: 2.5; }
      .actor { fill: #f8fafc; stroke: #111827; stroke-width: 2.5; }
      .abstract { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2.5; }
      .concrete { fill: #ecfdf5; stroke: #047857; stroke-width: 2.5; }
      .product { fill: #fef3c7; stroke: #b45309; stroke-width: 2.5; }
      .warning { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2.5; }
      .boxText { font: 800 16px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #111827; }
      .mutedText { font: 700 15px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #374151; }
      .arrow { stroke: #111827; stroke-width: 2.6; fill: none; }
      .dashed { stroke: #6b7280; stroke-width: 2.4; stroke-dasharray: 9 7; fill: none; }
      .arrowLabel { font: 700 14px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #374151; }
      .noteBox { fill: #111827; stroke: #111827; stroke-width: 2; }
      .noteText { font: 700 14px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #f9fafb; }
    </style>
  </defs>
  <rect width="1180" height="520" fill="#fffaf0"/>
  <text x="54" y="58" class="title">반복자 패턴</text>
  <text x="54" y="88" class="subtitle">Client는 hasNext()/next()만 알고 내부 저장 방식은 모른다</text>
  <line x1="230" y1="219" x2="320" y2="309" class="arrow" marker-end="url(#arrow)"/>
<text x="275" y="254" text-anchor="middle" class="arrowLabel">순회 요청</text>
<line x1="540" y1="164" x2="690" y2="164" class="dashed" marker-end="url(#arrow)"/>
<line x1="540" y1="309" x2="690" y2="309" class="dashed" marker-end="url(#arrow)"/>
<line x1="810" y1="203" x2="810" y2="270" class="arrow" marker-end="url(#arrow)"/>
<text x="858" y="244" text-anchor="middle" class="arrowLabel">생성</text>
  <rect x="70" y="180" width="160" height="78" rx="8" class="actor"/>
<text x="150" y="213" text-anchor="middle" class="boxText">Client</text>
<rect x="320" y="125" width="220" height="78" rx="8" class="abstract"/>
<text x="430" y="158" text-anchor="middle" class="boxText">Aggregate</text>
<text x="430" y="178" text-anchor="middle" class="boxText">createIterator()</text>
<rect x="320" y="270" width="220" height="78" rx="8" class="abstract"/>
<text x="430" y="303" text-anchor="middle" class="boxText">Iterator</text>
<text x="430" y="323" text-anchor="middle" class="boxText">hasNext()</text>
<text x="430" y="343" text-anchor="middle" class="boxText">next()</text>
<rect x="690" y="125" width="240" height="78" rx="8" class="product"/>
<text x="810" y="158" text-anchor="middle" class="boxText">ConcreteAggregate</text>
<text x="810" y="178" text-anchor="middle" class="boxText">List / Tree</text>
<rect x="690" y="270" width="240" height="78" rx="8" class="concrete"/>
<text x="810" y="303" text-anchor="middle" class="boxText">ConcreteIterator</text>
<text x="810" y="323" text-anchor="middle" class="boxText">현재 위치 보관</text>
  <rect x="70" y="405" width="430" height="54" rx="6" class="noteBox"/>
<text x="88" y="429" text-anchor="start" class="noteText">포인트: 반복자는 “이동 방법”을 맡고,</text>
<text x="88" y="449" text-anchor="start" class="noteText">비지터는 “방문해서 할 작업”을 맡는다.</text>
</svg>
