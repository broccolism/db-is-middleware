<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" role="img" aria-label="커맨드 패턴">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
        <marker id="umlGeneralization" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
          <path d="M 1 1 L 11 6 L 1 11 z" fill="#fffaf0" stroke="#111827" stroke-width="1.5"/>
        </marker>
    <style>
      .title { font: 800 30px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #111827; }
      .subtitle { font: 600 16px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #4b5563; }
      .box { fill: #eef2ff; stroke: #1f2937; stroke-width: 2.5; }
      .actor { fill: #f8fafc; stroke: #111827; stroke-width: 2.5; }
      .abstract { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2.5; }
      .concrete { fill: #ecfdf5; stroke: #047857; stroke-width: 2.5; }
      .product { fill: #fef3c7; stroke: #b45309; stroke-width: 2.5; }
      .warning { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2.5; }
      .boxText { font: 800 16px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #111827; }
      .mutedText { font: 700 15px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #374151; }
      .arrow { stroke: #111827; stroke-width: 2.6; fill: none; }
      .dashed { stroke: #6b7280; stroke-width: 2.4; stroke-dasharray: 9 7; fill: none; }
      .inheritance { stroke: #111827; stroke-width: 2.4; fill: none; }
      .realization { stroke: #6b7280; stroke-width: 2.4; stroke-dasharray: 9 7; fill: none; }
      .arrowLabel { font: 700 14px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #374151; }
      .noteBox { fill: #111827; stroke: #111827; stroke-width: 2; }
      .noteText { font: 700 14px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #f9fafb; }
    </style>
  </defs>
  <rect width="1180" height="520" fill="#fffaf0"/>
  <text x="54" y="58" class="title">커맨드 패턴</text>
  <text x="54" y="88" class="subtitle">추상 명령은 execute() 형식, 구체 명령은 실제 요청 하나를 담는다</text>
  <line x1="220" y1="219" x2="305" y2="179" class="arrow" marker-end="url(#arrow)"/>
<text x="262" y="189" text-anchor="middle" class="arrowLabel">execute()</text>
<line x1="610" y1="124" x2="515" y2="160" class="realization" marker-end="url(#umlGeneralization)"/>
<text x="562" y="132" text-anchor="middle" class="arrowLabel">구체 명령</text>
<line x1="610" y1="254" x2="515" y2="200" class="realization" marker-end="url(#umlGeneralization)"/>
<text x="562" y="240" text-anchor="middle" class="arrowLabel">구체 명령</text>
<line x1="820" y1="124" x2="910" y2="189" class="arrow" marker-end="url(#arrow)"/>
<text x="865" y="146" text-anchor="middle" class="arrowLabel">수행 위임</text>
<line x1="820" y1="254" x2="910" y2="219" class="arrow" marker-end="url(#arrow)"/>
<text x="865" y="226" text-anchor="middle" class="arrowLabel">수행 위임</text>
  <rect x="60" y="180" width="160" height="78" rx="8" class="actor"/>
<text x="140" y="213" text-anchor="middle" class="boxText">Invoker</text>
<text x="140" y="233" text-anchor="middle" class="boxText">Button</text>
<rect x="305" y="140" width="210" height="78" rx="8" class="abstract"/>
<text x="410" y="173" text-anchor="middle" class="boxText">Command</text>
<text x="410" y="193" text-anchor="middle" class="boxText">execute()</text>
<rect x="610" y="85" width="210" height="78" rx="8" class="concrete"/>
<text x="715" y="118" text-anchor="middle" class="boxText">SaveCommand</text>
<text x="715" y="138" text-anchor="middle" class="boxText">execute()</text>
<rect x="610" y="215" width="210" height="78" rx="8" class="concrete"/>
<text x="715" y="248" text-anchor="middle" class="boxText">DeleteCommand</text>
<text x="715" y="268" text-anchor="middle" class="boxText">execute()</text>
<rect x="910" y="150" width="190" height="78" rx="8" class="product"/>
<text x="1005" y="183" text-anchor="middle" class="boxText">Receiver</text>
<text x="1005" y="203" text-anchor="middle" class="boxText">실제 저장/삭제</text>
  <rect x="60" y="390" width="620" height="74" rx="6" class="noteBox"/>
<text x="78" y="414" text-anchor="start" class="noteText">포인트: Command는 공통 형식,</text>
<text x="78" y="434" text-anchor="start" class="noteText">SaveCommand/DeleteCommand는 명령 하나하나를 클래스로 분리한 것.</text>
</svg>
