<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" role="img" aria-label="프로토타입 패턴">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
        <marker id="umlGeneralization" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
          <path d="M 1 1 L 11 6 L 1 11 z" fill="#fffaf0" stroke="#111827" stroke-width="1.5"/>
        </marker>
    <style>
      .title { font: 800 30px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #111827; }
      .subtitle { font: 600 16px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #4b5563; }
      .box { fill: #eef2ff; stroke: #1f2937; stroke-width: 2.5; }
      .actor { fill: #f8fafc; stroke: #111827; stroke-width: 2.5; }
      .abstract { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2.5; }
      .concrete { fill: #ecfdf5; stroke: #047857; stroke-width: 2.5; }
      .product { fill: #fef3c7; stroke: #b45309; stroke-width: 2.5; }
      .warning { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2.5; }
      .boxText { font: 800 16px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #111827; }
      .mutedText { font: 700 15px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #374151; }
      .arrow { stroke: #111827; stroke-width: 2.6; fill: none; }
      .dashed { stroke: #6b7280; stroke-width: 2.4; stroke-dasharray: 9 7; fill: none; }
      .inheritance { stroke: #111827; stroke-width: 2.4; fill: none; }
      .realization { stroke: #6b7280; stroke-width: 2.4; stroke-dasharray: 9 7; fill: none; }
      .arrowLabel { font: 700 14px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #374151; }
      .noteBox { fill: #111827; stroke: #111827; stroke-width: 2; }
      .noteText { font: 700 14px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #f9fafb; }
    </style>
  </defs>
  <rect width="1180" height="520" fill="#fffaf0"/>
  <text x="54" y="58" class="title">프로토타입 패턴</text>
  <text x="54" y="88" class="subtitle">비싼 초기화나 런타임 상태를 가진 객체를 clone/copy로 재사용</text>
  <line x1="226" y1="229" x2="315" y2="190" class="arrow" marker-end="url(#arrow)"/>
<text x="270" y="199" text-anchor="middle" class="arrowLabel">key 요청</text>
<line x1="545" y1="190" x2="650" y2="149" class="arrow" marker-end="url(#arrow)"/>
<text x="597" y="159" text-anchor="middle" class="arrowLabel">원본 조회</text>
<line x1="755" y1="188" x2="755" y2="265" class="arrow" marker-end="url(#arrow)"/>
<text x="815" y="232" text-anchor="middle" class="arrowLabel">clone()</text>
<line x1="860" y1="304" x2="930" y2="229" class="dashed" marker-end="url(#arrow)"/>
<text x="895" y="256" text-anchor="middle" class="arrowLabel">new 숨김</text>
  <rect x="66" y="190" width="160" height="78" rx="8" class="actor"/>
<text x="146" y="223" text-anchor="middle" class="boxText">Client</text>
<rect x="315" y="150" width="230" height="78" rx="8" class="abstract"/>
<text x="430" y="183" text-anchor="middle" class="boxText">PrototypeRegistry</text>
<text x="430" y="203" text-anchor="middle" class="boxText">get(key).clone()</text>
<rect x="650" y="110" width="210" height="78" rx="8" class="product"/>
<text x="755" y="143" text-anchor="middle" class="boxText">ConcretePrototype</text>
<text x="755" y="163" text-anchor="middle" class="boxText">원본 객체</text>
<rect x="650" y="265" width="210" height="78" rx="8" class="concrete"/>
<text x="755" y="298" text-anchor="middle" class="boxText">Copied Object</text>
<text x="755" y="318" text-anchor="middle" class="boxText">복사본</text>
<rect x="930" y="190" width="180" height="78" rx="8" class="warning"/>
<text x="1020" y="223" text-anchor="middle" class="boxText">생성자 직접 호출</text>
<text x="1020" y="243" text-anchor="middle" class="boxText">감소</text>
  <rect x="66" y="405" width="470" height="54" rx="6" class="noteBox"/>
<text x="84" y="429" text-anchor="start" class="noteText">포인트: 레지스트리는 흔한 응용이고,</text>
<text x="84" y="449" text-anchor="start" class="noteText">본질은 기존 객체를 복제해 생성하는 것.</text>
</svg>
