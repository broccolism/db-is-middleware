<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" role="img" aria-label="템플릿 메소드 패턴">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
    <style>
      .title { font: 800 30px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #111827; }
      .subtitle { font: 600 16px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #4b5563; }
      .box { fill: #eef2ff; stroke: #1f2937; stroke-width: 2.5; }
      .actor { fill: #f8fafc; stroke: #111827; stroke-width: 2.5; }
      .abstract { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2.5; }
      .concrete { fill: #ecfdf5; stroke: #047857; stroke-width: 2.5; }
      .product { fill: #fef3c7; stroke: #b45309; stroke-width: 2.5; }
      .warning { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2.5; }
      .boxText { font: 800 16px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #111827; }
      .mutedText { font: 700 15px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #374151; }
      .arrow { stroke: #111827; stroke-width: 2.6; fill: none; }
      .dashed { stroke: #6b7280; stroke-width: 2.4; stroke-dasharray: 9 7; fill: none; }
      .arrowLabel { font: 700 14px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #374151; }
      .noteBox { fill: #111827; stroke: #111827; stroke-width: 2; }
      .noteText { font: 700 14px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #f9fafb; }
    </style>
  </defs>
  <rect width="1180" height="520" fill="#fffaf0"/>
  <text x="54" y="58" class="title">템플릿 메소드 패턴</text>
  <text x="54" y="88" class="subtitle">순서는 고정하고, hook/primitive operation만 바꾼다</text>
  <line x1="390" y1="175" x2="610" y2="129" class="dashed" marker-end="url(#arrow)"/>
<text x="500" y="142" text-anchor="middle" class="arrowLabel">상속</text>
<line x1="390" y1="220" x2="610" y2="284" class="dashed" marker-end="url(#arrow)"/>
<text x="500" y="270" text-anchor="middle" class="arrowLabel">상속</text>
<line x1="870" y1="129" x2="930" y2="209" class="arrow" marker-end="url(#arrow)"/>
<line x1="870" y1="284" x2="930" y2="239" class="arrow" marker-end="url(#arrow)"/>
  <rect x="80" y="135" width="310" height="78" rx="8" class="abstract"/>
<text x="235" y="168" text-anchor="middle" class="boxText">AbstractClass</text>
<text x="235" y="188" text-anchor="middle" class="boxText">templateMethod()</text>
<text x="235" y="208" text-anchor="middle" class="boxText">step1(); step2(); step3();</text>
<rect x="610" y="90" width="260" height="78" rx="8" class="concrete"/>
<text x="740" y="123" text-anchor="middle" class="boxText">ConcreteClassA</text>
<text x="740" y="143" text-anchor="middle" class="boxText">step2 구현</text>
<rect x="610" y="245" width="260" height="78" rx="8" class="product"/>
<text x="740" y="278" text-anchor="middle" class="boxText">ConcreteClassB</text>
<text x="740" y="298" text-anchor="middle" class="boxText">step2 구현</text>
<rect x="930" y="170" width="170" height="78" rx="8" class="actor"/>
<text x="1015" y="203" text-anchor="middle" class="boxText">같은 순서</text>
<text x="1015" y="223" text-anchor="middle" class="boxText">다른 단계</text>
  <rect x="80" y="405" width="500" height="54" rx="6" class="noteBox"/>
<text x="98" y="429" text-anchor="start" class="noteText">포인트: 전체 흐름은 부모가 잠그고,</text>
<text x="98" y="449" text-anchor="start" class="noteText">변하는 단계만 자식이 채운다.</text>
</svg>
