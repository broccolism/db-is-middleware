<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" role="img" aria-label="인터프리터 패턴">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
    <style>
      .title { font: 800 30px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #111827; }
      .subtitle { font: 600 16px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #4b5563; }
      .box { fill: #eef2ff; stroke: #1f2937; stroke-width: 2.5; }
      .actor { fill: #f8fafc; stroke: #111827; stroke-width: 2.5; }
      .abstract { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2.5; }
      .concrete { fill: #ecfdf5; stroke: #047857; stroke-width: 2.5; }
      .product { fill: #fef3c7; stroke: #b45309; stroke-width: 2.5; }
      .warning { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2.5; }
      .boxText { font: 800 16px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #111827; }
      .mutedText { font: 700 15px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #374151; }
      .arrow { stroke: #111827; stroke-width: 2.6; fill: none; }
      .dashed { stroke: #6b7280; stroke-width: 2.4; stroke-dasharray: 9 7; fill: none; }
      .arrowLabel { font: 700 14px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #374151; }
      .noteBox { fill: #111827; stroke: #111827; stroke-width: 2; }
      .noteText { font: 700 14px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #f9fafb; }
    </style>
  </defs>
  <rect width="1180" height="520" fill="#fffaf0"/>
  <text x="54" y="58" class="title">인터프리터 패턴</text>
  <text x="54" y="88" class="subtitle">작은 DSL이나 조건식을 Expression 트리로 만든 뒤 interpret()한다</text>
  <line x1="230" y1="229" x2="310" y2="174" class="arrow" marker-end="url(#arrow)"/>
<text x="270" y="191" text-anchor="middle" class="arrowLabel">입력 전달</text>
<line x1="530" y1="154" x2="620" y2="124" class="dashed" marker-end="url(#arrow)"/>
<line x1="530" y1="194" x2="620" y2="259" class="dashed" marker-end="url(#arrow)"/>
<line x1="840" y1="124" x2="925" y2="194" class="arrow" marker-end="url(#arrow)"/>
<line x1="840" y1="259" x2="925" y2="224" class="arrow" marker-end="url(#arrow)"/>
  <rect x="70" y="190" width="160" height="78" rx="8" class="actor"/>
<text x="150" y="223" text-anchor="middle" class="boxText">Context</text>
<text x="150" y="243" text-anchor="middle" class="boxText">문장/입력</text>
<rect x="310" y="135" width="220" height="78" rx="8" class="abstract"/>
<text x="420" y="168" text-anchor="middle" class="boxText">Expression</text>
<text x="420" y="188" text-anchor="middle" class="boxText">interpret()</text>
<rect x="620" y="85" width="220" height="78" rx="8" class="product"/>
<text x="730" y="118" text-anchor="middle" class="boxText">TerminalExpression</text>
<text x="730" y="138" text-anchor="middle" class="boxText">Word</text>
<rect x="620" y="220" width="220" height="78" rx="8" class="concrete"/>
<text x="730" y="253" text-anchor="middle" class="boxText">NonTerminalExpression</text>
<text x="730" y="273" text-anchor="middle" class="boxText">AND / OR</text>
<rect x="925" y="155" width="175" height="78" rx="8" class="product"/>
<text x="1012" y="188" text-anchor="middle" class="boxText">true / false</text>
<text x="1012" y="208" text-anchor="middle" class="boxText">해석 결과</text>
  <rect x="70" y="390" width="470" height="54" rx="6" class="noteBox"/>
<text x="88" y="414" text-anchor="start" class="noteText">포인트: 문법 요소를 클래스로 만든다.</text>
<text x="88" y="434" text-anchor="start" class="noteText">복잡한 언어는 보통 전용 파서가 더 낫다.</text>
</svg>
