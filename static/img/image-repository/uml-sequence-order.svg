<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
    <style>
      .title { font: 800 34px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #111827; }
      .subtitle { font: 600 18px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #4b5563; }
      .label { font: 800 20px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #111827; }
      .small { font: 700 17px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #111827; }
      .note { font: 600 15px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #4b5563; }
    </style>
  </defs>
  <rect width="1400" height="860" fill="#fffaf0"/>
  <text x="70" y="70" class="title">순차 다이어그램 예시: 온라인 주문 결제</text>
  <text x="70" y="104" class="subtitle">시간은 위에서 아래로 흐르고, 객체 사이의 메시지 호출 순서를 보여준다.</text>

  <g transform="translate(95 150)">
    <rect x="0" y="0" width="190" height="58" fill="#f8fafc" stroke="#111827" stroke-width="3"/>
    <text x="95" y="37" text-anchor="middle" class="label">고객</text>
    <rect x="315" y="0" width="190" height="58" fill="#dbeafe" stroke="#111827" stroke-width="3"/>
    <text x="410" y="37" text-anchor="middle" class="label">쇼핑몰 화면</text>
    <rect x="630" y="0" width="190" height="58" fill="#dbeafe" stroke="#111827" stroke-width="3"/>
    <text x="725" y="37" text-anchor="middle" class="label">주문 서비스</text>
    <rect x="945" y="0" width="190" height="58" fill="#dbeafe" stroke="#111827" stroke-width="3"/>
    <text x="1040" y="37" text-anchor="middle" class="label">결제 API</text>
    <rect x="1165" y="0" width="190" height="58" fill="#fef3c7" stroke="#111827" stroke-width="3"/>
    <text x="1260" y="37" text-anchor="middle" class="label">재고 DB</text>

    <line x1="95" y1="58" x2="95" y2="610" stroke="#9ca3af" stroke-width="3" stroke-dasharray="10 10"/>
    <line x1="410" y1="58" x2="410" y2="610" stroke="#9ca3af" stroke-width="3" stroke-dasharray="10 10"/>
    <line x1="725" y1="58" x2="725" y2="610" stroke="#9ca3af" stroke-width="3" stroke-dasharray="10 10"/>
    <line x1="1040" y1="58" x2="1040" y2="610" stroke="#9ca3af" stroke-width="3" stroke-dasharray="10 10"/>
    <line x1="1260" y1="58" x2="1260" y2="610" stroke="#9ca3af" stroke-width="3" stroke-dasharray="10 10"/>

    <rect x="405" y="105" width="10" height="380" fill="#111827"/>
    <rect x="720" y="160" width="10" height="315" fill="#111827"/>
    <rect x="1035" y="310" width="10" height="118" fill="#111827"/>
    <rect x="1255" y="210" width="10" height="75" fill="#111827"/>

    <line x1="95" y1="120" x2="405" y2="120" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="250" y="108" text-anchor="middle" class="small">상품 주문 요청</text>

    <line x1="415" y1="175" x2="720" y2="175" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="568" y="163" text-anchor="middle" class="small">createOrder()</text>

    <line x1="730" y1="225" x2="1255" y2="225" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="992" y="213" text-anchor="middle" class="small">재고 확인</text>
    <line x1="1255" y1="275" x2="730" y2="275" stroke="#6b7280" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
    <text x="992" y="263" text-anchor="middle" class="small">재고 가능</text>

    <line x1="730" y1="325" x2="1035" y2="325" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="883" y="313" text-anchor="middle" class="small">결제 승인 요청</text>
    <line x1="1035" y1="420" x2="730" y2="420" stroke="#6b7280" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
    <text x="883" y="408" text-anchor="middle" class="small">승인 번호 반환</text>

    <line x1="720" y1="470" x2="415" y2="470" stroke="#6b7280" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
    <text x="568" y="458" text-anchor="middle" class="small">주문 완료</text>
    <line x1="405" y1="525" x2="95" y2="525" stroke="#6b7280" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
    <text x="250" y="513" text-anchor="middle" class="small">주문번호 표시</text>
  </g>

  <rect x="70" y="790" width="1260" height="42" fill="#111827"/>
  <text x="94" y="817" class="note" fill="#f9fafb">포인트: 순차 다이어그램은 “누가 누구에게 어떤 메시지를 어떤 순서로 보내는가”를 설명한다.</text>
</svg>
