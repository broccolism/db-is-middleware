<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
    <marker id="triangle" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#fffaf0" stroke="#111827" stroke-width="1.5"/>
    </marker>
    <style>
      .title { font: 800 34px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #111827; }
      .subtitle { font: 600 18px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #4b5563; }
      .label { font: 800 20px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #111827; }
      .small { font: 700 16px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #111827; }
      .green { fill: #15803d; }
      .orange { fill: #c2410c; }
      .note { font: 600 15px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #f9fafb; }
    </style>
  </defs>
  <rect width="1400" height="880" fill="#fffaf0"/>
  <text x="70" y="70" class="title">유스케이스 다이어그램 예시: 온라인 쇼핑몰</text>
  <text x="70" y="104" class="subtitle">액터가 시스템으로 무엇을 할 수 있는지, 그리고 include/extend/generalization 관계를 함께 보여준다.</text>

  <rect x="330" y="145" width="840" height="595" rx="18" fill="#ffffff" stroke="#111827" stroke-width="3"/>
  <text x="360" y="184" class="label">온라인 쇼핑몰 시스템</text>

  <g stroke="#111827" stroke-width="4" fill="none">
    <circle cx="145" cy="300" r="22"/>
    <line x1="145" y1="322" x2="145" y2="380"/>
    <line x1="100" y1="342" x2="190" y2="342"/>
    <line x1="145" y1="380" x2="108" y2="435"/>
    <line x1="145" y1="380" x2="182" y2="435"/>
    <circle cx="145" cy="540" r="22"/>
    <line x1="145" y1="562" x2="145" y2="620"/>
    <line x1="100" y1="582" x2="190" y2="582"/>
    <line x1="145" y1="620" x2="108" y2="675"/>
    <line x1="145" y1="620" x2="182" y2="675"/>
    <circle cx="1260" cy="430" r="22"/>
    <line x1="1260" y1="452" x2="1260" y2="510"/>
    <line x1="1215" y1="472" x2="1305" y2="472"/>
    <line x1="1260" y1="510" x2="1223" y2="565"/>
    <line x1="1260" y1="510" x2="1297" y2="565"/>
  </g>
  <text x="145" y="470" text-anchor="middle" class="label">고객</text>
  <text x="145" y="710" text-anchor="middle" class="label">회원</text>
  <text x="1260" y="600" text-anchor="middle" class="label">관리자</text>

  <g fill="#dbeafe" stroke="#2563eb" stroke-width="3">
    <ellipse cx="500" cy="300" rx="100" ry="42"/>
    <ellipse cx="720" cy="300" rx="100" ry="42"/>
    <ellipse cx="940" cy="300" rx="100" ry="42"/>
    <ellipse cx="720" cy="470" rx="100" ry="42"/>
    <ellipse cx="940" cy="470" rx="100" ry="42"/>
    <ellipse cx="720" cy="625" rx="100" ry="42"/>
    <ellipse cx="930" cy="625" rx="100" ry="42"/>
    <ellipse cx="930" cy="690" rx="100" ry="42"/>
  </g>
  <text x="500" y="307" text-anchor="middle" class="label">상품 조회</text>
  <text x="720" y="307" text-anchor="middle" class="label">상품 주문</text>
  <text x="940" y="307" text-anchor="middle" class="label">로그인</text>
  <text x="720" y="477" text-anchor="middle" class="label">결제하기</text>
  <text x="940" y="477" text-anchor="middle" class="label">쿠폰 적용</text>
  <text x="720" y="632" text-anchor="middle" class="label">주문 취소</text>
  <text x="930" y="632" text-anchor="middle" class="label">관리 업무</text>
  <text x="930" y="697" text-anchor="middle" class="label">상품 관리</text>

  <line x1="195" y1="355" x2="400" y2="310" stroke="#111827" stroke-width="3"/>
  <line x1="195" y1="360" x2="620" y2="306" stroke="#111827" stroke-width="3"/>
  <line x1="195" y1="595" x2="620" y2="624" stroke="#111827" stroke-width="3"/>
  <line x1="1215" y1="500" x2="1018" y2="616" stroke="#111827" stroke-width="3"/>

  <line x1="820" y1="300" x2="840" y2="300" stroke="#15803d" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
  <text x="830" y="276" text-anchor="middle" class="small green">&lt;&lt;include&gt;&gt;</text>
  <line x1="720" y1="342" x2="720" y2="428" stroke="#15803d" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
  <text x="762" y="388" class="small green">&lt;&lt;include&gt;&gt;</text>

  <line x1="872" y1="438" x2="790" y2="335" stroke="#c2410c" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
  <text x="850" y="390" class="small orange">&lt;&lt;extend&gt;&gt;</text>

  <line x1="145" y1="518" x2="145" y2="458" stroke="#111827" stroke-width="3" marker-end="url(#triangle)"/>
  <text x="164" y="493" class="small">일반화</text>
  <line x1="930" y1="648" x2="930" y2="665" stroke="#111827" stroke-width="3" marker-start="url(#triangle)"/>
  <text x="952" y="668" class="small">일반화</text>

  <rect x="70" y="805" width="1260" height="42" fill="#111827"/>
  <text x="94" y="832" class="note">포인트: 연관은 액터와 기능의 참여, include는 필수 공통 기능, extend는 조건부 추가 기능, 일반화는 특수한 것에서 일반적인 것으로 향한다.</text>
</svg>
