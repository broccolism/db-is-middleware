<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
    <marker id="triangle" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 1 1 L 13 7 L 1 13 z" fill="#fffaf0" stroke="#111827" stroke-width="1.6"/>
    </marker>
    <style>
      .title { font: 800 36px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #111827; }
      .subtitle { font: 600 19px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #4b5563; }
      .system { font: 800 22px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #111827; }
      .label { font: 800 21px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #111827; }
      .small { font: 700 16px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #111827; }
      .relationLabel { font: 800 17px Apple SD Gothic Neo, Malgun Gothic, sans-serif; }
      .green { fill: #15803d; }
      .orange { fill: #c2410c; }
      .note { font: 600 16px Apple SD Gothic Neo, Malgun Gothic, sans-serif; fill: #f9fafb; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="#fffaf0"/>
  <text x="70" y="74" class="title">유스케이스 다이어그램 예시: 온라인 쇼핑몰</text>
  <text x="70" y="112" class="subtitle">액터, 연관, include, extend, generalization을 서로 다른 구역에 배치해 읽기 쉽게 보여준다.</text>

  <rect x="340" y="150" width="1020" height="725" rx="18" fill="#ffffff" stroke="#111827" stroke-width="3"/>
  <text x="382" y="196" class="system">온라인 쇼핑몰 시스템</text>

  <!-- Actors -->
  <g stroke="#111827" stroke-width="4" fill="none" stroke-linecap="square">
    <circle cx="150" cy="295" r="24"/>
    <line x1="150" y1="319" x2="150" y2="385"/>
    <line x1="100" y1="345" x2="200" y2="345"/>
    <line x1="150" y1="385" x2="108" y2="450"/>
    <line x1="150" y1="385" x2="192" y2="450"/>

    <circle cx="150" cy="615" r="24"/>
    <line x1="150" y1="639" x2="150" y2="705"/>
    <line x1="100" y1="665" x2="200" y2="665"/>
    <line x1="150" y1="705" x2="108" y2="770"/>
    <line x1="150" y1="705" x2="192" y2="770"/>

    <circle cx="1470" cy="610" r="24"/>
    <line x1="1470" y1="634" x2="1470" y2="700"/>
    <line x1="1420" y1="660" x2="1520" y2="660"/>
    <line x1="1470" y1="700" x2="1428" y2="765"/>
    <line x1="1470" y1="700" x2="1512" y2="765"/>
  </g>
  <text x="150" y="494" text-anchor="middle" class="label">고객</text>
  <text x="150" y="814" text-anchor="middle" class="label">회원</text>
  <text x="1470" y="810" text-anchor="middle" class="label">관리자</text>

  <!-- Actor generalization: Member -> Customer -->
  <line x1="150" y1="572" x2="150" y2="505" stroke="#111827" stroke-width="3" marker-end="url(#triangle)"/>
  <rect x="176" y="526" width="70" height="24" fill="#fffaf0"/>
  <text x="188" y="545" class="small">일반화</text>

  <!-- Use cases -->
  <g fill="#dbeafe" stroke="#2563eb" stroke-width="3">
    <ellipse cx="520" cy="285" rx="118" ry="44"/>
    <ellipse cx="520" cy="430" rx="118" ry="44"/>
    <ellipse cx="520" cy="660" rx="118" ry="44"/>
    <ellipse cx="870" cy="265" rx="118" ry="44"/>
    <ellipse cx="870" cy="430" rx="118" ry="44"/>
    <ellipse cx="870" cy="585" rx="118" ry="44"/>
    <ellipse cx="1070" cy="650" rx="118" ry="44"/>
    <ellipse cx="1070" cy="790" rx="118" ry="44"/>
  </g>
  <text x="520" y="293" text-anchor="middle" class="label">상품 조회</text>
  <text x="520" y="438" text-anchor="middle" class="label">상품 주문</text>
  <text x="520" y="668" text-anchor="middle" class="label">주문 취소</text>
  <text x="870" y="273" text-anchor="middle" class="label">로그인</text>
  <text x="870" y="438" text-anchor="middle" class="label">결제하기</text>
  <text x="870" y="593" text-anchor="middle" class="label">쿠폰 적용</text>
  <text x="1070" y="658" text-anchor="middle" class="label">관리 업무</text>
  <text x="1070" y="798" text-anchor="middle" class="label">상품 관리</text>

  <!-- Associations: actors to use cases -->
  <g stroke="#111827" stroke-width="3" fill="none">
    <line x1="205" y1="345" x2="402" y2="285"/>
    <line x1="205" y1="365" x2="402" y2="430"/>
    <line x1="205" y1="665" x2="402" y2="660"/>
    <line x1="1420" y1="660" x2="1188" y2="650"/>
  </g>

  <!-- Include relationships from order to required use cases -->
  <line x1="628" y1="412" x2="768" y2="287" stroke="#15803d" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
  <rect x="648" y="326" width="118" height="25" fill="#ffffff"/>
  <text x="658" y="345" class="relationLabel green">&lt;&lt;include&gt;&gt;</text>

  <line x1="638" y1="430" x2="752" y2="430" stroke="#15803d" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
  <rect x="650" y="401" width="118" height="25" fill="#ffffff"/>
  <text x="660" y="420" class="relationLabel green">&lt;&lt;include&gt;&gt;</text>

  <!-- Extend relationship: optional coupon use case extends order -->
  <line x1="770" y1="560" x2="608" y2="462" stroke="#c2410c" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
  <rect x="660" y="514" width="112" height="25" fill="#ffffff"/>
  <text x="670" y="533" class="relationLabel orange">&lt;&lt;extend&gt;&gt;</text>

  <!-- Use case generalization: product management is a specialized management task -->
  <line x1="1070" y1="746" x2="1070" y2="696" stroke="#111827" stroke-width="3" marker-end="url(#triangle)"/>
  <rect x="1090" y="711" width="70" height="24" fill="#ffffff"/>
  <text x="1100" y="730" class="small">일반화</text>

  <rect x="70" y="908" width="1460" height="46" fill="#111827"/>
  <text x="96" y="937" class="note">포인트: 연관은 액터와 기능의 참여, include는 필수 공통 기능, extend는 조건부 추가 기능, 일반화는 특수한 것에서 일반적인 것으로 향한다.</text>
</svg>
